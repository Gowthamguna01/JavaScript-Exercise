<script>
    let n,i,f,g;
    function program(n,g){
        for(i=1;i<=n;i++){
            f=parseInt(prompt("Enter num="));
            
            if(f<g){
                g=f
            }
            return(g, "small is")
        }
    }

n=parseInt(prompt("Enter num="));
g=parseInt(prompt("Enter num="));
x=program(n,g)
document.write(x)
</script>
