            f=f+1
            return(c, "<br><br>")
        }
        f=0;
        n=c;
        for(n;n>=0;n--){

            n=parseInt(n/2)
            m=m+Math.pow(10,f)*b

        }
    }

a=parseInt(prompt("Enter Value="));

document.write(x)
