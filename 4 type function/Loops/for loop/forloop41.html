<script>
    let a,c,f,i;
    function program(a){
        c=0;
        f=0;
        i=0;
        for(i=a;i>=0;i--){
            b=a%10;
            a=parseInt(a/10)
            c=c+Math.pow(8,f)*b
            f=f+1;
            return(c, "<br><br>")
        }
    }

a=parseInt(prompt("enter Value="));
x=program(a)
document.write(x)
</script>
