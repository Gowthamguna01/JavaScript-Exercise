<script>
    let n,i,v;
    function program(n){
        v=0;
        for(i=1;i<=n;i++){ 
            if(n%i==0){
                v=v+1
                return(v,"<br><br>")
            }
        }
        
        if(v==2){
            return(n, "prime number","<br><br>")
        }

        else{
            return(n, "not prime number","<br><br>")
        }
    }


n=parseInt(prompt("Enter Number="));
x=program(n)
document.write(x)   
</script>
