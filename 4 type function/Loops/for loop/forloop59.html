<script>
    let n,i,a;
    function program(n){
        a=0;
        for(i=1;i<=n;i++){
            s=parseInt(prompt("Enter s num="));
            
            if(s%2==1){
                a=a+s;
            }
            return(a, "<br><br>")
        }
    }

n=parseInt(prompt("Enter N Number="));
x=program(n)
document.write(x)
    
</script>
