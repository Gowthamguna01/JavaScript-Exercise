<script>
   let a,c,f;
   function program(a){
      c=0;
      f=0;
      do{
         b=a%8;
         a=parseInt(a/8);
         c=c+Math.pow(10,f)*b
         f=f+1;
         return(c , "<br><br>")
      }while(a>0);
   }


a=parseInt(prompt("Enter value="));
x=program(a)
document.write(x)
</script>
