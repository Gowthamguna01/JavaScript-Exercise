<script>
    //factorial 1/i and odd
    "use strict"
    let a,i,j,b;
    function program(a){
        i=1;
        j=1;
        b=0;
        do{
            if(i%2==1){
                j=j*i;
                b=b+(1/j);
                return(b,"<br><br>")
            }
            i=i+1
        }while(i<=a);
    }

a=parseInt(prompt("enter value="));

x=program(a)
document.write(x)
</script>
