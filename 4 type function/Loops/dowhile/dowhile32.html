<script>
    let  n,a,c,d,m;
    function program(n){
        c=0;
        a=n;
        d=0;
        m=n;
        do{
            n=parseInt(n/10); //loop stop
            c=c+1 //digit find
            return(c, "<br><br>")
        }while(n>0);

        do{
            b=a%10; //reverse
            d=Math.pow(b,c);
            a=parseInt(a/10); //loop stop
            return(d, "<br><br>")
        }while(a>0);
    }

n=parseInt(prompt("Enter Value="));
x=program(n)
document.write(x)
</script>
