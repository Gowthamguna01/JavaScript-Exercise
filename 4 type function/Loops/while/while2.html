<script>
    //even number
    "use strict"
    let n,i;
    function program(n){
        i=1;
        while(i<=n){
            if(i%2==0){
                return(i)
            }
            i=i+1
        }
    }
    
n=parseInt(prompt("enter value="));
x=program(n)
document.write(x)
</script>
