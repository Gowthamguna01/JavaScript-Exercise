<script>
    //sum of odd
    "use strict"
    let a,i,j;
    function program(a){
        i=1;
        j=0;
        while(i<=a){
            if(i%2==1){
                return(j)
                j=j+i
            }
            i=i+1
        }
    }

a=parseInt(prompt("Enter Value="));
x=program(a)
document.write(x)
</script>
