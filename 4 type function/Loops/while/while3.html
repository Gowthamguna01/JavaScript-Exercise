<script>
    //odd number
    "use strict"
    let n,i;
    function program(n){
        i=1;
        while(i<=n){
            if(i%2==1){
                return("  odd number= ",i)
            }
            i=i+1
        }
    }

n=parseInt(prompt("Enter value="));
x=program(n)
document.write(x)
</script>
