<script>
    let n,i,a,e,d;
    function program(n){
        for(i=1;i<=n;i++){
            b=string.length(i);
            a=Math.pow(i,2);
            e=Math.pow(10,b);
            d=a%e;
        }
        
        if(i==d){
            document.write(i, "Automorphic");
        }
    
    }
    
n=parseInt(prompt("Enter n num="));
x=program(n)
document.write(x)
</script>
