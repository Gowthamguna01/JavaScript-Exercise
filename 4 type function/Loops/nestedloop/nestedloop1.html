<script>
    let n,c,i;
    function program(n){
        c=0;
        for(i=100;i<=n;){
            d=0;
            j=i;
            for(j;j>0;j--){
                s=j%10
                d=d*10+s
                j=parseInt(j/10)
            }
        }

        if(i==d){
            return(i , "palindrome")
        }
        i=i+1
    }

n=parseInt(prompt("Enter n="));
x=program(n)
document.write(x)
</script>
