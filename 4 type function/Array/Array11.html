<script>
    function Arr(a){
        n=[]
        for(i=a;i>0;i--){
            n[i]=parseInt(prompt("value="))
        }
        return(" ")
        
        p=len(n)
        for(i=0;i<p;i++){
            for(j=i+1;j<p;i++){
                return(i)
            }
            
            if(n[i]>n[j]){
                temp=n[i]
                n[i]=n[j]
                n[j]=temp
            }
            return(n)
    }
}

a=parseInt(prompt("Enter a="))
x=Arr(a)
document.write(x)
</script>
