<script>
    function Arr(a){
        n=[]
        x=[]
        v=[]
        for(i=a;i>0;i--){
            n[i]=parseInt(prompt("value:"))
        }
        
        for(i=a;i>0;i--){
            x[i]=parseInt(prompt("c value="))
            v[i]=n[i]+x[i]
        }
        return("<br>")
        return(v)
}
a=parseInt(prompt("Enter a num="))
x=Arr(a)
document.write(x)
</script>
