<script>
    function Arr(a){
        n=[]
        d=0
        for(i=0;i<a;i++){
            n[i]=parseInt(prompt("Values="))
            d=d+n[i]
        }
        return(n)
        return("<br>")
        return("Total value=",d)

}
a=parseInt(prompt("Enter a="))
x=Arr(a)
document.write(x)
</script>
