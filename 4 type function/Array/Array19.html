<script>
    function Arr(a){
        n=[]
        for(i=a;i>0;i--){
            n[i]=parseInt(prompt("Value="))
        }
        return(n)
        
        for(i=a;i>0;i--){
            for(j=i;j<a;j++){
                if(n[i]==n[j]){
                    return("duplicate nummber=",n[i])
                }
            }
        }
    }
a=parseInt(prompt("Enter a="))
x=Arr(a)
document.write(x)
</script>
