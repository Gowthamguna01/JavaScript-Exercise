<script>
    function Arr(){
    a=parseInt(prompt("Enter a="))
    n=[]
    for(i=0;i<a;i++){
        n[i]=parseInt(prompt("value="))
    }

    return(n)

    c=parseInt(prompt("C value="))
    x=[]
    for(i=0;i<a;i++){
        if(c!=n[i]){
            x.push(n[i])
        }
    }
    return("<br>")
    return(x)
}

x=Arr()
document.write(x)
</script>
