<script>
    function biggest(){
        a=parseInt(prompt("Enter a"))
        b=parseInt(prompt("Enter b"))
        c=parseInt(prompt("Enter c"))
        if(a>b && a>c){
            return("A is big")
        }
        else if(b>a && b>c){
            return("B is big")
        }
        else if(c>a && c>b){
            return("c is big")
        }
    }
x=biggest()
document.write(x)
</script>
