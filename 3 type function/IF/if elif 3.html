<script>
    function arithmatic(){
        a=parseInt(prompt("Enter a="))
        b=parseInt(prompt("Enter b="))
        c=(prompt("Enter c="))
        if(c=="1" || c=="+"){
            d=a+b
            return(d)
        }
        else if(c=="2" || c=="-"){
            d=a-b
            return(d)
        }
        else if(c=="3" || c=="*"){
            d=a*b
            return(d)
        }
        else if(c=="4" || c=="/"){
            d=a/b
            return(d)
        }
        else if(c=="5" || c=="%"){
            d=a%b
            return(d)
        }
    }
    
x=arithmatic()
document.write(x)
</script>
