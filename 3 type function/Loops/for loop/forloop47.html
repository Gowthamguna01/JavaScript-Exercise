<script>
    function program(){
    let n,i,v;
    n=parseInt(prompt("Enter Number="));
    v=0
    for(i=1;i<=n;i++){
        if(n%i==0){
            v=v+1
            return(v,"<br><br>")
        }

    }
        if(v==2){
            return(n, "prime number","<br><br>")
        }

        else{
            return(n, "not prime number","<br><br>")
        }
}

x=program()
document.write(x)
   
</script>
