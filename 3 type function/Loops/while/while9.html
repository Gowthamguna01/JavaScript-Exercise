<script>
    //sum of even
    "use strict"
    function program(){
    let a,i,j;
    a=parseInt(prompt("Enter Value="));
    i=1
    j=0
    while(i<=a){
        if(i%2==0){
            return(j)
            j=j+i
        }
        i=i+1
    }
}

x=program()
document.write(x)
</script>
