<script>
    //sum of odd
    "use strict"
    function program(){
    let a,i,j;
    a=parseInt(prompt("Enter Value="));
    i=1
    j=0
    while(i<=a){
        if(i%2==1){
            return(j)
            j=j+i  
        }
        i=i+1
    }
}
x=program()
document.write(x)
</script>
