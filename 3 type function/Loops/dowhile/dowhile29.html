<script>
    //Print each character in string.
    "use strict"
    function program(){
    let a,b,i;
    a=prompt("Enter char=");
    b=a.length;//length
    return("length of a=",b,"<br>");
    i=0
    do{
        return(a[i],"<br>")
        i=i+1
    }while(i<b);

}

x=program()
document.write(x)

</script>
