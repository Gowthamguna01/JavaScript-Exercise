<script>
    "use strict"
    function program(){
    let a,d,c,b;
    a=parseInt(prompt("Enter Value="));
    d=0
    c=a
    do{
        b=a%10;
        a=parseInt(a/10);
        d=d*10+b;
        return(d, "<br><br>")
    }while(a>0);
    if(d==c){
        return("palindrome")
    }
    else{
        return("Not palindrome")
    }
}

x=program()
document.write(x)

</script>
