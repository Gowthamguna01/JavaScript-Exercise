<script>
    //factorial 1/i
    "use strict"
    function program(){
    let a,i,j,b;
    a=parseInt(prompt("enter value="));
    i=1
    j=1
    b=0
    do{
        j=j*i; //factorial
        b=b+(1/j); //sum  of factorial
        return(b,"<br><br>")
        i=i+1
    }while(i<=a);
}

x=program()
document.write(x)

</script>
