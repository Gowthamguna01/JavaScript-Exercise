<script>
    class Mat{
        Match(){
            let a;
            a=prompt("Enter charecter=");
            
            switch (a){
                case 'a':
                case 'e':
                case 'i':
                case 'o':
                case 'u':
                    document.write("vowels");
                    break;
                default:
                     document.write("consonants");
            }
        }
    }

x = new Mat()
x.Match()

</script>
