<script>
    class Pos{
        positive_negative(){
            a=parseInt(prompt("Enter a="));
            
            if(a>0){
                document.write("Positive");
            }
            
            else if(a<0){
                document.write("Negative");
            }
            
            else if(a==0){
                document.write("netural");
            }
        }
    }

x = new Pos()
x.positive_negative()

</script>
