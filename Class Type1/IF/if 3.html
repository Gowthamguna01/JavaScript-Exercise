<script>
    class Sma{
        small(){
            let a,b;
            a=parseInt(prompt("Enter a="));
            b=parseInt(prompt("Enter b="));
            if(a<b){
                document.write("A is small")
            }
            
            if(b<a){
                document.write("B is small")
            }
        }
    }

x = new Sma()
x.small()
</script>
