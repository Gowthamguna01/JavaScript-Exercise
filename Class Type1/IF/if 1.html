<script>
    class Number{
        oddeven(){
            let n;
            n=parseInt(prompt("Enter n="));
            if(n%2==0){
                document.write("Even number")
            }
            
            if(n%2==1){
                document.write("odd number")
            }
        }
    }

x = new Number() 
x.oddeven()
</script>
