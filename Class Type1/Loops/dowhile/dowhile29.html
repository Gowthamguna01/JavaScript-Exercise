<script>
    //Print each character in string.
    
    class Stri{
        "use strict"
        program(){
            let a,b,i;
            a=prompt("Enter char=");
            b=a.length;//length
            document.write("length of a=",b,"<br>");
            i=0;
            do{
                document.write(a[i],"<br>")
                i=i+1;
            }while(i<b);
        }
    }

x = new Stri()
x.program()

</script>
