<script>
    //-10 to -1
    class Common{
        "use strict"
        program(){
            let n;
            n=parseInt(prompt("Enter value=")); //doesn't need (i) in reverse
            while(n<=-1){
                document.write(n,"<br>");
                n=n+1;
            }
        }
    }

x = new Common()
x.program()
</script>
