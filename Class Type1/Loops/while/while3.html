<script>
    //odd number
    class Common{
        "use strict"
        program(){
            let n,i;
            n=parseInt(prompt("Enter value="));
            i=1;
            while(i<=n){
                if(i%2==1){
                    document.write("odd number",i, "<br>")
                }
                i=i+1;
            }
        }
    }

x = new Common()
x.program()

</script>
