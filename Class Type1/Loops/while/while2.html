<script>
    //even number
    
    class Common{
        "use strict"
        program(){
            let n,i;
            n=parseInt(prompt("enter value="));
            i=0;
            while(i<=n){
                if(i%2==0){
                    document.write(i,"<br>")
                }
                i=i+1;
            }
        }
    }

x = new Common()
x.program()

</script>
