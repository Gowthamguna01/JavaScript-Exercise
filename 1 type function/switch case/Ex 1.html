<script>
    function Match(){
        a=prompt("Enter value")

        switch (a){

            case 'a':
            case 'e':
            case 'i':
            case 'o':
            case 'u':
            document.write("vowels")
            break;

            default:
                document.write("consonants")

        }
    }
    
Match()

</script>
