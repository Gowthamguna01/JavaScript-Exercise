<script>
    //tables
    "use strict"
    function program(){
    let T,b,i,r;
    T=parseInt(prompt("Enter your table number="));
    i=1
    r=16
   do{
        b=i*T;
        document.write(i,"X", T,"=", b, "<br><br>")
        i=i+1
    } while(i<=r);

}

program()


</script>
