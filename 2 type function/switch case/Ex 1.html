<script>
    function Match(a){
        switch (a){
            case 'a':
            case 'e':
            case 'i':
            case 'o':
            case 'u':
            document.write("vowels")
            break;

            default:
                document.write("consonants")

        }
    }


a=prompt("Enter value")
Match(a)

</script>
