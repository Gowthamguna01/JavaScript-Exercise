<script>
    //odd number
    "use strict"
    let n,i;
    function program(n){
        i=1
        while(i<=n){
            if(i%2==1){
                document.write("  odd number= ",i)
            }
            i=i+1
        }
    }


n=parseInt(prompt("Enter value="));
program(n)

</script>
