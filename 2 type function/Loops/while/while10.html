<script>
    //sum of odd
    "use strict"
    let a,i,j;
    function program(a){
        i=1;
        j=0;
        while(i<=a){
            if(i%2==1){
                document.write(j)
                j=j+i
            }
            i=i+1
        }
    }

a=parseInt(prompt("Enter Value="));
program(a)
</script>
