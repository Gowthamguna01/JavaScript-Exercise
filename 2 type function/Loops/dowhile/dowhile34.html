<script>
    //Given number is Perfect number or Not.
    let n;
    function program(n){
        i=1;
        j=0;
        while(i<n){
            if(n%i==0){
                j=j+i;
                i=i+1;
                document.write(j)
            }
        }
    }

n=parseInt(prompt("Enter Value="));
program(n)
</script>
