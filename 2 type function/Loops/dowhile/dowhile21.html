<script>
    //factorial sum of even
    let a,i,j,b;
    function program(a){
        i=1;
        b=0;
        j=1;
        do{
            if(i%2==0){
                j=j*i; //factorial
                b=b+j; //sum of factorial
                document.write(b,"<br><br>")
            }
            i=i+1 
        } while(i<=a);
    }


a=parseInt(prompt("Enter value="));
program(a);

</script>
