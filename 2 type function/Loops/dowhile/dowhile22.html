<script>
    //factorial 1/i
    "use strict"
    let a,i,j,b;
    function program(a){
    i=1;
    j=1;
    b=0;
    do{
        j=j*i; //factorial
        b=b+(1/j); //sum  of factorial
        document.write(b,"<br><br>")
        i=i+1
    }while(i<=a);
    }

a=parseInt(prompt("enter value="));
program(a)

</script>
