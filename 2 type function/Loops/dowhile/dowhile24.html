<script>
    //factorial 1/i and odd
    "use strict"
    
    function program(a){
        let a,i,j,b;
        i=1;
        j=1;
        b=0;
        do{
            if(i%2==0){
            j=j*i;
            b=b+(1/j);
            document.write(b,"<br><br>")
        }
        i=i+1
    }while(i<=a);
}

a=parseInt(prompt("enter value="));
program(a)

</script>
