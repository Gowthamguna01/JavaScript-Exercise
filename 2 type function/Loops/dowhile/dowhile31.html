<script>
    // Given number is Palindrome or Not
    "use strict"
    let a,d,c,b;
    function program(a){
        d=0
        c=a
        do{
            b=a%10;
            a=parseInt(a/10);
            d=d*10+b;
            document.write(d, "<br><br>")
        }while(a>0);
        
        if(d==c){
            document.write("palindrome")
        }
        
        else{
            document.write("Not palindrome")
        }
    }


a=parseInt(prompt("Enter Value="));
program(a)
</script>
