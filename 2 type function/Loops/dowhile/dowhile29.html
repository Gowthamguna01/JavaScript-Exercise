<script>
    //Print each character in string.
    "use strict"
    let a,b,i;
    function program(a){
        i=0
        do{
            b=a.length;//length
            document.write(a[i],"<br>")
            i=i+1
        }while(i<b);
    }

a=prompt("Enter char=");
program(a)

</script>
