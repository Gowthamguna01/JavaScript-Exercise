<script>
    //Given number from decimal to binary
    let n,c,f;
    function program(n){
        c=0;
        f=0;
        do{
            b=n%2;
            n=parseInt(n/10);
            c=c+Math.pow(10,f)*b;
            f=f+1;
            document.write(c ,"<br><br>");
        }while(n>0);
    }

n=parseInt(prompt("Enter Value="));
program(n)
</script>
