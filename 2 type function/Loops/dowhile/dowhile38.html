<script>
    //Given number from binary to decimal.
    let a,c,f,d,b;
    function program(a){
        c=0;
        f=0;
        do{
            b=a%10;
            a=parseInt(a/10);
            c=c+Math.pow(20,f)*b;
            d=d+b*2+f;
            document.write(d)
        }while(a>0);
    }

a=parseInt(prompt("Enter Value="));
program(a)
</script>
