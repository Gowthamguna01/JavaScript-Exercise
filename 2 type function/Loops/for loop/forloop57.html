<script>
    //Find smallest of number for n times value.
    let n,i,f,g;
    function program(n,g){

    for(i=1;i<=n;i++){
        f=parseInt(prompt("Enter num="));
        if(f<g){
            g=f
        }
        document.write(g, "small is") 
    }
    }

n=parseInt(prompt("Enter num="));
g=parseInt(prompt("Enter num="));
program(n,g)
</script>
