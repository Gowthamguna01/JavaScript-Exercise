<script>
    //Pell series .p2=p0+2p1, p0=0, p1=1. (0, 1, 2, 5, 12, 29….n)
    let a,p1,p0,i,n;
    function program(n){
        p0=0;
        p1=1;
        for(i=1;i<=n;i++){
            document.write(p0, "<br><br>")
            p2=p0+2*p1;
            p0=p1;
            p1=p2;
        }
    }


n=parseInt(prompt("Enter num="));
program(n)
</script>
