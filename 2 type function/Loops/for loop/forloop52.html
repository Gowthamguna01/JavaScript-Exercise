<script>
    // Calculate sum of digits of a number
    let n,c,a;
    function program(n){
        c=0
        for(n;n>=0;n--){
            a=n%10;
            n=parseInt(n/10)
            c=c+a;
            document.write(c, "<br><br>")
        }
    }

n=parseInt(prompt("Enter Value="));
program(n)
</script>
