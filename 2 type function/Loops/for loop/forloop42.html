<script>
    //Given number from octal to binary.
    let a,c,f,m,b;
    function program(a){
        c=0;
        f=0;
        m=0;
        for(a;a>=0;a--){
            b=a%10;
            a=parseInt(a/10);
            c=c+Math.pow(8,f)*b;
            f=f+1;
            document.write(c, "<br><br>")
        }
        f=0;
        n=c;
        for(n;n>=0;n--){
            b=n%2
            n=parseInt(n/2)
            m=m+Math.pow(10,f)*b
            f=f+1
            document.write(m, "<br><br>")
        }
    }

a=parseInt(prompt("Enter Value="));
program(a)

</script>
