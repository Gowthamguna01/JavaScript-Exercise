<script>
    //Sum of even number for n times value.
    let n,i,a;
    function program(n){
        a=0;
        for(i=1;i<=n;i++){
            s=parseInt(prompt("Enter s num="));
            if(s%2==0){
                a=a+s 
            }
            document.write(a, "<br><br>")
        }
    }

n=parseInt(prompt("Enter N Number="));
program(n)
    
</script>
