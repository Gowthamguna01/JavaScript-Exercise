<script>
    function arithmatic(a,b,c){
        
        if(c=="1" || c=="+"){
            d=a+b
            document.write(d)
        }
        else if(c=="2" || c=="-"){
            d=a-b
            document.write(d)
        }
        else if(c=="3" || c=="*"){
            d=a*b
            document.write(d)
        }
        else if(c=="4" || c=="/"){
            d=a/b
            document.write(d)
        }
        else if(c=="5" || c=="%"){
            d=a%b
            document.write(d)
        }
    }


a=parseInt(prompt("Enter a="))
b=parseInt(prompt("Enter b="))
c=(prompt("Enter c="))
    
arithmatic(a,b,c)
</script>
