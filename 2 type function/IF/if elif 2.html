<script>
    function positive_negative(a){
        a=parseInt(prompt("Enter a="))
        if(a>0){
            document.write("Positive")
        }
        else if(a<0){
            document.write("Negative")
        }
        else if(a==0){
            document.write("netural")
        }
    }
a=parseInt(prompt("Enter a="))
positive_negative(a)
</script>
