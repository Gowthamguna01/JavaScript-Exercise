<script>
    function biggest(a,b,c){
        
        if(a>b && a>c){
            document.write("A is big")
        }
        else if(b>a && b>c){
            document.write("B is big")
        }
        else if(c>a && c>b){
            document.write("c is big")
        }
    }

a=parseInt(prompt("Enter a"))
b=parseInt(prompt("Enter b"))
c=parseInt(prompt("Enter c"))
biggest(a,b,c)
</script>
